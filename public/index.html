<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Site Analyzer — MVP</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .fade-in { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

<div class="max-w-5xl mx-auto px-6 py-10">

  <header class="mb-8">
    <h1 class="text-3xl font-bold">Site Analyzer <span class="text-indigo-600">MVP</span></h1>
    <p class="text-slate-500 mt-1">Семантический анализ страницы против конкурентов</p>
  </header>

  <form id="form" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-5">
    <div>
      <label class="block text-sm font-medium mb-1">Исходный запрос</label>
      <input id="query" type="text" required
        class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"
        value="настройка robots.txt для сайта">
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">URL вашей страницы</label>
      <input id="target" type="url" required
        class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"
        value="https://site-analyzer.ru/articles/robots-txt/">
    </div>

    <div>
      <label class="block text-sm font-medium mb-2">URL конкурентов (3–5)</label>
      <div id="competitors" class="space-y-2"></div>
      <button type="button" id="addComp"
        class="mt-2 text-sm text-indigo-600 hover:text-indigo-800 font-medium">+ добавить</button>
    </div>

    <button type="submit" id="submitBtn"
      class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">
      Анализировать
    </button>
  </form>

  <div id="status" class="mt-6 hidden text-center text-slate-500">
    <div class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-indigo-600 border-t-transparent mr-2 align-middle"></div>
    <span id="statusText">Загружаю страницы…</span>
  </div>

  <div id="error" class="mt-6 hidden bg-red-50 border border-red-200 text-red-700 rounded-lg p-4"></div>

  <div id="results" class="mt-8 space-y-6 hidden"></div>

</div>

<script>
const competitorDefaults = [
  'https://habr.com/ru/articles/1018250/',
  'https://skobeeff.com/blog/gayd-po-robots-txt/',
  'https://timeweb.cloud/docs/general/nastrojka-fajla-robots-txt',
];

const compContainer = document.getElementById('competitors');

function addCompetitor(value = '') {
  const row = document.createElement('div');
  row.className = 'flex gap-2';
  row.innerHTML = `
    <input type="url" required value="${value}"
      class="comp flex-1 border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
    <button type="button" class="remove px-3 text-slate-400 hover:text-red-500">×</button>
  `;
  row.querySelector('.remove').onclick = () => row.remove();
  compContainer.appendChild(row);
}

competitorDefaults.forEach(addCompetitor);
document.getElementById('addComp').onclick = () => addCompetitor();

const form = document.getElementById('form');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const errorEl = document.getElementById('error');
const resultsEl = document.getElementById('results');
const submitBtn = document.getElementById('submitBtn');

form.onsubmit = async (e) => {
  e.preventDefault();
  errorEl.classList.add('hidden');
  resultsEl.classList.add('hidden');
  statusEl.classList.remove('hidden');
  submitBtn.disabled = true;
  submitBtn.classList.add('opacity-50');

  const query = document.getElementById('query').value.trim();
  const target = document.getElementById('target').value.trim();
  const competitors = [...document.querySelectorAll('.comp')]
    .map(i => i.value.trim()).filter(Boolean);

  const steps = ['Загружаю страницы…', 'Считаю эмбеддинги…', 'Сравниваю…'];
  let step = 0;
  statusText.textContent = steps[0];
  const timer = setInterval(() => {
    step = Math.min(step + 1, steps.length - 1);
    statusText.textContent = steps[step];
  }, 3000);

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, target, competitors }),
    });

    if (!res.ok) {
      const { error } = await res.json();
      throw new Error(error || 'Ошибка сервера');
    }

    const data = await res.json();
    render(data);
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.remove('hidden');
  } finally {
    clearInterval(timer);
    statusEl.classList.add('hidden');
    submitBtn.disabled = false;
    submitBtn.classList.remove('opacity-50');
  }
};

const verdictStyles = {
  danger:  { bg: 'bg-red-50',    border: 'border-red-200',    text: 'text-red-800',    badge: 'bg-red-100 text-red-700' },
  warning: { bg: 'bg-amber-50',  border: 'border-amber-200',  text: 'text-amber-900',  badge: 'bg-amber-100 text-amber-700' },
  ok:      { bg: 'bg-emerald-50',border: 'border-emerald-200',text: 'text-emerald-900',badge: 'bg-emerald-100 text-emerald-700' },
};

function render(data) {
  resultsEl.innerHTML = '';
  resultsEl.classList.remove('hidden');

  const v = data.verdict;
  const s = verdictStyles[v.level] || verdictStyles.ok;
  const verdictBlock = `
    <div class="fade-in ${s.bg} ${s.border} border rounded-xl p-6">
      <div class="flex items-center gap-3 mb-2">
        <span class="${s.badge} text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wide">${v.level}</span>
        <h2 class="text-xl font-bold ${s.text}">${v.title}</h2>
      </div>
      <p class="${s.text} text-sm leading-relaxed">${v.text}</p>
    </div>
  `;

  const matrixBlock = `
    <div class="fade-in bg-white rounded-xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-xl font-bold mb-4">Матрица сходства</h2>
      <div class="space-y-2">
        ${data.matrix.map(m => {
          const pct = m.similarity;
          const color = pct > 85 ? 'bg-red-500' : pct > 70 ? 'bg-amber-500' : 'bg-emerald-500';
          return `
            <div class="flex items-center gap-3">
              <div class="text-sm text-slate-600 w-64 truncate">${m.from} ↔ ${m.to}</div>
              <div class="flex-1 bg-slate-100 rounded-full h-2.5 overflow-hidden">
                <div class="${color} h-full rounded-full" style="width: ${pct}%"></div>
              </div>
              <div class="text-sm font-semibold w-14 text-right">${pct}%</div>
            </div>
          `;
        }).join('')}
      </div>
      <p class="text-xs text-slate-400 mt-4">Чем выше %, тем более похож контент. Высокое сходство с конкурентом = сильная конкуренция за один и тот же спрос.</p>
    </div>
  `;

  const keywordsBlock = `
    <div class="fade-in bg-white rounded-xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-xl font-bold mb-4">Ключевые слова</h2>
      <div class="grid md:grid-cols-2 gap-4">
        ${data.keywords.map(k => `
          <div class="border border-slate-100 rounded-lg p-4">
            <div class="text-sm font-semibold text-slate-700 mb-2 truncate">${k.label}</div>
            <div class="flex flex-wrap gap-1.5">
              ${k.words.length
                ? k.words.map(w => `
                    <span class="text-xs bg-slate-100 text-slate-700 px-2 py-1 rounded-md">
                      ${w.word} <span class="text-slate-400">${w.count}</span>
                    </span>
                  `).join('')
                : '<span class="text-xs text-slate-400">нет данных</span>'}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  const gapBlock = `
    <div class="fade-in grid md:grid-cols-2 gap-6">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
        <h2 class="text-xl font-bold mb-1">Чего нет у вас</h2>
        <p class="text-xs text-slate-400 mb-4">Есть у конкурентов, но отсутствует на вашей странице</p>
        ${data.gap.missing.length ? `
          <ul class="space-y-2">
            ${data.gap.missing.map(m => `
              <li class="flex items-center justify-between text-sm">
                <span class="font-mono text-slate-700">${m.word}</span>
                <span class="text-xs bg-red-50 text-red-600 px-2 py-0.5 rounded">у ${m.sources} конкурентов</span>
              </li>
            `).join('')}
          </ul>
        ` : '<p class="text-sm text-slate-400">Ничего критичного не пропущено</p>'}
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
        <h2 class="text-xl font-bold mb-1">Где вы слабее</h2>
        <p class="text-xs text-slate-400 mb-4">У вас заметно реже, чем у конкурентов</p>
        ${data.gap.weak.length ? `
          <ul class="space-y-2">
            ${data.gap.weak.map(w => `
              <li class="flex items-center justify-between text-sm">
                <span class="font-mono text-slate-700">${w.word}</span>
                <span class="text-xs text-slate-500">
                  <span class="text-red-500 font-semibold">${w.mine}</span> vs <span class="font-semibold">${w.avgCompetitor}</span>
                </span>
              </li>
            `).join('')}
          </ul>
        ` : '<p class="text-sm text-slate-400">По частоте вы не отстаёте</p>'}
      </div>
    </div>
  `;

  const uniqueBlock = data.gap.unique.length ? `
    <div class="fade-in bg-white rounded-xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-xl font-bold mb-1">Уникальные темы вашей страницы</h2>
      <p class="text-xs text-slate-400 mb-4">Есть у вас, нет ни у одного из конкурентов</p>
      <div class="flex flex-wrap gap-2">
        ${data.gap.unique.map(w => `
          <span class="text-xs bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-md font-mono">${w}</span>
        `).join('')}
      </div>
    </div>
  ` : '';

  resultsEl.innerHTML = verdictBlock + matrixBlock + keywordsBlock + gapBlock + uniqueBlock;
}
</script>

</body>
</html>
